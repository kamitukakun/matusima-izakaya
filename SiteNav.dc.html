<x-dc>

  <div style="max-width:1512px;margin:0 auto;padding:6px clamp(14px,3vw,44px);display:flex;flex-wrap:wrap;align-items:center;gap:6px clamp(10px,2vw,26px)">
    <a href="TOP.dc.html" style="display:flex;align-items:baseline;gap:10px;padding:10px 0;margin-right:auto;text-decoration:none">
      <span style="font-family:'Shippori Mincho B1',serif;font-weight:600;font-size:clamp(20px,2.2vw,25px);letter-spacing:.16em;color:#f4ecdd">凪火</span>
      <span style="font:400 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.36em;color:#a08f77">NAGIBI</span>
      <span style="font-size:9.5px;letter-spacing:.2em;color:#7e7263;white-space:nowrap">松島・海鮮居酒屋</span>
    </a>
    <nav aria-label="サイト内メニュー" style="display:flex;flex-wrap:wrap;align-items:center;gap:0 2px">
      <a href="TOP.dc.html" data-page="top" style="padding:13px 11px;font:500 11px/1 'Noto Sans JP',sans-serif;letter-spacing:.2em;color:#cdc2b0;border-bottom:1px solid transparent;text-decoration:none" style-hover="color:#f4ecdd;border-bottom-color:rgba(196,70,42,.7)">TOP</a>
      <a href="ABOUT.dc.html" data-page="about" style="padding:13px 11px;font:500 11px/1 'Noto Sans JP',sans-serif;letter-spacing:.2em;color:#cdc2b0;border-bottom:1px solid transparent;text-decoration:none" style-hover="color:#f4ecdd;border-bottom-color:rgba(196,70,42,.7)">ABOUT</a>
      <a href="MENU.dc.html" data-page="menu" style="padding:13px 11px;font:500 11px/1 'Noto Sans JP',sans-serif;letter-spacing:.2em;color:#cdc2b0;border-bottom:1px solid transparent;text-decoration:none" style-hover="color:#f4ecdd;border-bottom-color:rgba(196,70,42,.7)">MENU</a>
      <a href="SPACE.dc.html" data-page="space" style="padding:13px 11px;font:500 11px/1 'Noto Sans JP',sans-serif;letter-spacing:.2em;color:#cdc2b0;border-bottom:1px solid transparent;text-decoration:none" style-hover="color:#f4ecdd;border-bottom-color:rgba(196,70,42,.7)">SPACE</a>

    </nav>
    <a href="TOP.dc.html#instagram" style="display:inline-flex;align-items:center;gap:9px;padding:12px 2px 12px 14px;font:500 11px/1 'Noto Sans JP',sans-serif;letter-spacing:.24em;color:#f0d9bd;border-left:1px solid rgba(239,230,214,.18);text-decoration:none" style-hover="color:#e8935a;letter-spacing:.3em">INSTAGRAM<span style="font-size:13px">→</span></a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:110},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;menu&quot;,&quot;space&quot;,&quot;news&quot;,&quot;access&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const cur = String(this.props.current || '').toLowerCase();
    document.querySelectorAll('[data-page]').forEach((a) => {
      if (a.getAttribute('data-page') === cur) {
        a.style.color = '#f0c79b';
        a.style.borderBottomColor = '#c4462a';
      }
    });
  }
}
</script>
