<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:#161310">
  <sc-if value="{{ hasSrc }}" hint-placeholder-val="{{ false }}">
    <img src="{{ src }}" alt="{{ alt }}" style="width:100%;height:100%;object-fit:cover;display:block" />
  </sc-if>
  <sc-if value="{{ noSrc }}" hint-placeholder-val="{{ true }}">
    <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:14px;background-image:repeating-linear-gradient(128deg,#1a1613 0 7px,#15120f 7px 14px);box-shadow:inset 0 0 0 1px rgba(239,230,214,.09)">
      <span style="font:400 10px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#9a8d7b;text-align:center;text-transform:uppercase">{{ label }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:320},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PHOTO PLACEHOLDER&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const src = this.props.src || '';
    return {
      src,
      hasSrc: !!src,
      noSrc: !src,
      alt: this.props.alt || '',
      label: this.props.label || 'PHOTO PLACEHOLDER'
    };
  }
}
</script>
</body>
</html>
